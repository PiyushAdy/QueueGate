services:
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
    postgres-data:
