<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueGate</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    
    <!-- BeerCSS Material 3 Design -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.7.12/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0" crossorigin="anonymous"></script>

    <style>
        :root {
            --font: 'Inter', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            margin: 0;
            background-color: var(--surface-container-low);
            font-family: 'Inter', sans-serif;
        }
        .card-container {
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        .hidden { display: none !important; }
        .event-list-box {
            max-height: 240px;
            overflow-y: auto;
        }
        .metric-box {
            text-align: center;
            padding: 1rem;
            background-color: var(--surface-container-high);
            border-radius: 12px;
        }
        .metric-num {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.1;
        }
        .metric-lbl {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body class="light">

<article class="card-container medium-padding round surface">

    <!-- Screen 1: Event Selection / Creation -->
    <div id="view-home">
        <div class="center-align">
            <h5 class="bold no-margin">QueueGate</h5>
            <p class="secondary-text small-text margin-top-small">High-concurrency ticket queue system</p>
        </div>

        <button id="btn-create-event" class="responsive primary margin-top" onclick="handleCreateEvent()">
            <i>add_circle</i>
            <span>Create New Event</span>
        </button>

        <div class="divider margin-top margin-bottom"></div>
        
        <div class="row middle-align">
            <span class="bold small-text max">Active Events</span>
            <button class="circle transparent small" onclick="loadEvents()" title="Refresh list">
                <i>refresh</i>
            </button>
        </div>

        <div id="event-list" class="event-list-box margin-top-small">
            <div class="center-align padding"><progress class="circle small"></progress></div>
        </div>
    </div>

    <!-- Screen 2: Live Queue Room -->
    <div id="view-queue" class="hidden">
        <nav class="no-padding">
            <button class="circle transparent" onclick="goHome()">
                <i>arrow_back</i>
            </button>
            <div class="max">
                <h6 id="queue-event-title" class="bold no-margin truncate">Event Queue</h6>
                <div id="queue-event-subtitle" class="small-text secondary-text">Connecting...</div>
            </div>
        </nav>

        <div id="badge-wrapper" class="center-align margin-top"></div>

        <!-- Metrics Grid -->
        <div id="metrics-panel" class="grid margin-top hidden">
            <div class="s6">
                <div class="metric-box">
                    <div class="metric-num primary-text" id="disp-pos">--</div>
                    <div class="metric-lbl secondary-text">Your Position</div>
                </div>
            </div>
            <div class="s6">
                <div class="metric-box">
                    <div class="metric-num secondary-text" id="disp-total">--</div>
                    <div class="metric-lbl secondary-text">In Queue</div>
                </div>
            </div>
        </div>

        <p id="queue-info-text" class="center-align secondary-text small-text margin-top">
            Join the queue to reserve your spot.
        </p>

        <!-- Dynamic Action Button -->
        <button id="btn-main-action" class="responsive primary margin-top" onclick="onMainActionClick()">
            <i>group_add</i>
            <span>Join Queue</span>
        </button>
    </div>

</article>

<!-- Toast Notification Container -->
<div class="snackbar" id="toast">
    <i id="toast-icon">info</i>
    <span id="toast-msg"></span>
</div>

<script>
    const API = window.location.origin;

    let currentEventId = null;
    let currentEventName = "Live Event";
    let currentQueueId = null;
    let currentQueueToken = null;
    let socket = null;
    let uiState = "IDLE"; // IDLE | JOINING | WAITING | ADMITTED | BOOKING | BOOKED | EXPIRED

    function getOrCreateClientId() {
        let cid = localStorage.getItem('qg_clientId');
        if (!cid) {
            cid = crypto.randomUUID();
            localStorage.setItem('qg_clientId', cid);
        }
        return cid;
    }
    const clientId = getOrCreateClientId();

    async function sha256(message) {
        const encoder = new TextEncoder();
        const dataBytes = encoder.encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', dataBytes);
        const hashBytes = new Uint8Array(hashBuffer);
        const hexString = Array.from(hashBytes)
            .map(byte => byte.toString(16).padStart(2, '0'))
            .join('');
        return hexString;
    }

    function showToast(msg, icon = 'info') {
        document.getElementById('toast-msg').innerText = msg;
        document.getElementById('toast-icon').innerText = icon;
        ui('#toast');
    }

    window.onload = () => {
        const hash = location.hash.slice(1).trim();
        
        if (!hash) return loadEvents();
        selectEvent(hash);
    };

    // --- Fetch All Active Events ---
    async function loadEvents() {
        const container = document.getElementById('event-list');
        container.innerHTML = '<div class="center-align padding"><progress class="circle small"></progress></div>';
        
        try {
            const res = await fetch(`${API}/events`);
            const json = await res.json();
            const events = json.data || [];

            if (events.length === 0) {
                container.innerHTML = '<p class="center-align secondary-text padding small-text">No active events found.<br>Create one above!</p>';
                return;
            }

            container.innerHTML = events.map(ev => `
                <a class="row wave small-round small-padding cursor-pointer margin-bottom-small" onclick="selectEvent('${ev.id}', '${escapeHtml(ev.name)}')">
                    <i class="primary-text">confirmation_number</i>
                    <div class="max">
                        <div class="bold truncate">${escapeHtml(ev.name)}</div>
                        <div class="small-text secondary-text">${ev.totalInventory} total tickets • ${ev.holdSec || 30}s hold</div>
                    </div>
                    <i class="secondary-text">chevron_right</i>
                </a>
            `).join('');
        } catch (err) {
            container.innerHTML = '<p class="center-align error-text small-text padding">Failed to load events.</p>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    async function selectEvent(id, name) {
        currentEventId = id;
        currentEventName = name || "Live Event";
        location.hash = id;

        document.getElementById('view-home').classList.add('hidden');
        document.getElementById('view-queue').classList.remove('hidden');
        document.getElementById('queue-event-title').innerText = currentEventName;
        document.getElementById('queue-event-subtitle').innerText = "Event ID: " + id.slice(0, 8) + "...";

        if (!name) {
            fetch(`${API}/events/${id}`).then(r => r.json()).then(ev => {
                if (ev && ev.eventName) {
                    currentEventName = ev.eventName;
                    document.getElementById('queue-event-title').innerText = ev.eventName;
                }
            }).catch(() => {});
        }

        const savedRaw = localStorage.getItem(`qg_session_${currentEventId}`);
        if (savedRaw) {
            try {
                const session = JSON.parse(savedRaw);
                currentQueueId = session.queueId;
                currentQueueToken = session.queueToken;
                
                setUIState("WAITING");
                document.getElementById('queue-info-text').innerText = "Restoring queue position...";
                const statusRes = await fetch(`${API}/events/${currentEventId}/queue/${currentQueueId}`);
                const statusData = await statusRes.json();

                if (statusData && !statusData.error && statusData.status) {
                    applyStatusUpdate(statusData);
                    connectWebSocket();
                } else {
                    clearSavedSession();
                    setUIState("IDLE");
                    showToast("Previous queue session has expired.", "timer_off");
                }
            } catch (e) {
                clearSavedSession();
                setUIState("IDLE");
            }
        } else {
            setUIState("IDLE");
        }
    }

    function clearSavedSession() {
        localStorage.removeItem(`qg_session_${currentEventId}`);
        currentQueueId = null;
        currentQueueToken = null;
        if (socket) {
            socket.disconnect();
            socket = null;
        }
    }

    function goHome() {
        if (socket) {
            socket.disconnect();
            socket = null;
        }
        currentEventId = null;
        location.hash = '';
        document.getElementById('view-queue').classList.add('hidden');
        document.getElementById('view-home').classList.remove('hidden');
        loadEvents();
    }

    async function handleCreateEvent() {
        const btn = document.getElementById('btn-create-event');
        btn.disabled = true;
        btn.innerHTML = '<progress class="circle small"></progress><span>Creating...</span>';

        try {
            const randomNum = Math.floor(Math.random() * 9000) + 1000;
            const eventName = `Concert VIP #${randomNum}`;

            const res = await fetch(`${API}/events`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    eventName: eventName,
                    totalInventory: 1,
                    holdSec: 30
                })
            });
            const data = await res.json();

            if (data.eventID) {
                showToast("Event created successfully!", "check_circle");
                selectEvent(data.eventID, eventName);
            } else {
                throw new Error(data.status || "Failed to create");
            }
        } catch (err) {
            showToast("Failed to create event.", "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i>add_circle</i><span>Create New Event</span>';
        }
    }

    async function handleJoinQueue() {
        setUIState("JOINING");

        try {
            const res = await fetch(`${API}/events/${currentEventId}/join`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clientId })
            });
            const data = await res.json();

            if (data && data.queueId) {
                currentQueueId = data.queueId;
                currentQueueToken = data.queueToken;

                // Save session for page refreshes
                localStorage.setItem(`qg_session_${currentEventId}`, JSON.stringify({
                    queueId: currentQueueId,
                    queueToken: currentQueueToken
                }));

                applyStatusUpdate(data);
                connectWebSocket();
            } else {
                throw new Error(data.message || "Failed to join queue");
            }
        } catch (err) {
            showToast("Could not join queue. Please retry.", "error");
            setUIState("IDLE");
        }
    }

    function connectWebSocket() {
        if (socket) socket.disconnect();

        socket = io(API, {
            query: {
                queueId: currentQueueId,
                eventId: currentEventId
            },
            transports: ["websocket", "polling"]
        });

        socket.on("connect", () => {
            console.log("WebSocket connected to QueueGate gateway");
        });

        socket.on("queue:status", (data) => {
            applyStatusUpdate(data);
        });

        socket.on("queue:admitted", (data) => {
            applyStatusUpdate({ ...data, status: "admitted" });
        });

        socket.on("queue:expired", (data) => {
            clearSavedSession();
            applyStatusUpdate({ ...data, status: "expired" });
        });

        socket.on("event:sold_out", (data) => {
            clearSavedSession();
            applyStatusUpdate({ ...data, status: "sold_out" });
        });

        socket.on("connect_error", (err) => {
            console.warn("Socket auth or connection error:", err.message);
            // If session is invalid, reset gracefully
            if (err.message && err.message.includes("Authentication failed")) {
                clearSavedSession();
                setUIState("IDLE");
                showToast("Queue session expired or reset.", "timer_off");
            }
        });
    }

    function applyStatusUpdate(data) {
        if (!data) return;

        const pos = (data.currentPos !== undefined && data.currentPos !== null) 
            ? data.currentPos 
            : (data.position !== undefined && data.position !== null ? data.position : null);

        const total = (data.totalWaiting !== undefined && data.totalWaiting !== null) 
            ? data.totalWaiting 
            : null;

        if (pos !== null) {
            document.getElementById('disp-pos').innerText = pos > 0 ? `#${pos}` : 'Turn!';
        }
        if (total !== null) {
            document.getElementById('disp-total').innerText = total;
        }

        const status = (data.status || '').toLowerCase();

        if (status === 'waiting') {
            setUIState("WAITING");
            document.getElementById('queue-info-text').innerText = "You are in line. Live updates are active.";
        } else if (status === 'admitted') {
            setUIState("ADMITTED");
            document.getElementById('disp-pos').innerText = "Turn!";
            document.getElementById('queue-info-text').innerText = "You have been admitted! Complete booking before your hold expires.";
            showToast("You're up! Proceed to checkout.", "celebration");
        } else if (status === 'expired') {
            setUIState("EXPIRED");
            document.getElementById('queue-info-text').innerText = "Your 30-second ticket hold has expired.";
            showToast(data.message || "Your hold expired.", "timer_off");
        } else if (status === 'booked') {
            setUIState("BOOKED");
            document.getElementById('queue-info-text').innerText = "Your ticket has been confirmed in PostgreSQL!";
        } else if (status === 'sold_out') {
            setUIState("SOLD_OUT");
            document.getElementById('queue-info-text').innerText = "All tickets have been booked. This event is sold out.";
            showToast("Event is officially sold out!", "cancel");
        }
    }

    async function handleConfirmBooking() {
        if (!currentQueueToken) {
            showToast("Missing ticket token. Please re-join.", "error");
            return;
        }

        setUIState("BOOKING");

        try {
            const queueTokenHash = await sha256(currentQueueToken);
            const res = await fetch(`${API}/events/${currentEventId}/book`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    clientId,
                    queueId: currentQueueId,
                    queueTokenHash
                })
            });
            const data = await res.json();

            if (data.status === "Success") {
                clearSavedSession();
                setUIState("BOOKED");
                showToast("Booking successfully confirmed!", "celebration");
            } else {
                showToast(data.message || "Booking failed.", "error");
                if (data.message && data.message.includes("expired")) {
                    clearSavedSession();
                    setUIState("EXPIRED");
                } else {
                    setUIState("ADMITTED");
                }
            }
        } catch (err) {
            showToast("Network error during checkout.", "error");
            setUIState("ADMITTED");
        }
    }

    function setUIState(state) {
        uiState = state;

        const badge = document.getElementById('badge-wrapper');
        const metrics = document.getElementById('metrics-panel');
        const btn = document.getElementById('btn-main-action');

        switch (state) {
            case "IDLE":
                badge.innerHTML = '';
                metrics.classList.add('hidden');
                btn.className = 'responsive primary margin-top';
                btn.disabled = false;
                btn.innerHTML = '<i>group_add</i><span>Join Queue</span>';
                document.getElementById('queue-info-text').innerText = "Join the queue to reserve your spot.";
                break;

            case "JOINING":
                metrics.classList.add('hidden');
                btn.disabled = true;
                btn.innerHTML = '<progress class="circle small"></progress><span>Entering Line...</span>';
                break;

            case "WAITING":
                badge.innerHTML = '<span class="chip tertiary-container small-round"><i>hourglass_empty</i>Waiting in Line</span>';
                metrics.classList.remove('hidden');
                btn.className = 'responsive secondary margin-top';
                btn.disabled = true;
                btn.innerHTML = '<i>schedule</i><span>In Queue...</span>';
                break;

            case "ADMITTED":
                badge.innerHTML = '<span class="chip primary-container small-round"><i>verified</i>Turn Reached (Hold Active)</span>';
                metrics.classList.remove('hidden');
                btn.className = 'responsive primary margin-top';
                btn.disabled = false;
                btn.innerHTML = '<i>shopping_cart_checkout</i><span>Confirm & Book Ticket</span>';
                break;

            case "BOOKING":
                btn.disabled = true;
                btn.innerHTML = '<progress class="circle small"></progress><span>Securing Booking...</span>';
                break;

            case "BOOKED":
                badge.innerHTML = '<span class="chip primary-container small-round"><i>celebration</i>Booking Confirmed!</span>';
                metrics.classList.add('hidden');
                btn.className = 'responsive tertiary margin-top';
                btn.disabled = false;
                btn.innerHTML = '<i>arrow_back</i><span>Back to Events</span>';
                break;

            case "EXPIRED":
                badge.innerHTML = '<span class="chip error-container small-round"><i>timer_off</i>Hold Expired</span>';
                metrics.classList.add('hidden');
                btn.className = 'responsive error margin-top';
                btn.disabled = false;
                btn.innerHTML = '<i>refresh</i><span>Re-Join Queue</span>';
                break;

            case "SOLD_OUT":
                badge.innerHTML = '<span class="chip error-container small-round"><i>cancel</i>Sold Out</span>';
                metrics.classList.add('hidden');
                btn.className = 'responsive secondary margin-top';
                btn.disabled = false;
                btn.innerHTML = '<i>arrow_back</i><span>Back to Events</span>';
                break;
        }
    }

    function onMainActionClick() {
        if (uiState === "IDLE") {
            handleJoinQueue();
        } else if (uiState === "ADMITTED") {
            handleConfirmBooking();
        } else if (uiState === "BOOKED" || uiState === "SOLD_OUT") {
            goHome();
        } else if (uiState === "EXPIRED") {
            handleJoinQueue();
        }
    }
</script>
</body>
</html>
