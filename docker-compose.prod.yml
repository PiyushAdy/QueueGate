services:
  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:15.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      APP_PORT: 3000
      REDIS_PORT: 6379
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

volumes:
    postgres-data:
